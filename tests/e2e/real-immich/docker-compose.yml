name: immich-pages-e2e-real

# Disposable, local-only fixture stack for E2E tests. Never point at real user data.
# Mirrors immich-app/immich's own production docker-compose.yml (service shapes, image
# tags/digests) and its e2e/docker-compose.yml (ML-disabled env var, Postgres command
# flags) -- both confirmed by reading those files directly, not guessed. Version pinned
# to the latest release at authoring time (v3.3.1); see README.md to bump it deliberately.

services:
  immich-server:
    container_name: immich-pages-e2e-real-server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.1}
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MACHINE_LEARNING_ENABLED: 'false'
      IMMICH_IGNORE_MOUNT_CHECK_ERRORS: 'true'
    volumes:
      - immich-upload:/data
      - ../../resources/heic-test-set:/external/heic-test-set:ro
    ports:
      - '4101:2283'
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    restart: 'no'

  redis:
    container_name: immich-pages-e2e-real-redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping || exit 1
    restart: 'no'

  database:
    container_name: immich-pages-e2e-real-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    command: -c fsync=off -c shared_preload_libraries=vchord.so -c config_file=/var/lib/postgresql/data/postgresql.conf
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 1s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: 'no'

volumes:
  immich-upload:
