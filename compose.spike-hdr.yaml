# Throwaway spike override (see .planning/spikes/) -- NOT part of the production deployment.
# Rebuild and run with:
#   docker compose -f compose.yaml -f compose.spike-hdr.yaml up -d --build
# Then open https://<your-pages-host>/spike-hdr-formats from any device, including over the
# public IP/domain your Traefik setup already serves -- this reuses the same service, network,
# and TLS/Traefik labels as the normal deployment, just with a different image/Dockerfile.
# No env vars or volume mounts needed: the route is always on and the real local fixtures are
# baked into this image at build time (see Dockerfile.spike-hdr.dockerignore).
# Remove the spike once you're done comparing:
#   docker compose -f compose.yaml -f compose.spike-hdr.yaml down
#   docker compose up -d --build   # back to the real production image
services:
  pages:
    build:
      dockerfile: Dockerfile.spike-hdr
    image: immich-pages:spike-hdr
